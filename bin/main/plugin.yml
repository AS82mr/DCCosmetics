name: DCCosmetics
version: 1.0.0
main: dc.dccosmetics.DCCosmetics
api-version: '1.21'
author: YourName
description: A highly modular, packet-based holographic cosmetics system.

# This ensures the server loads ProtocolLib BEFORE our plugin
depend:
  - ProtocolLib

commands:
  cosmetics:
    description: Open the cosmetics menu or manage cosmetics.
    aliases: [dcc]
    usage: /<command>
  profile:
    description: View your own or another player's profile.
    usage: /<command> [player]
  customise:
    description: Customise the cosmetic applied to your held item.
    aliases: [customize]
    usage: /<command>
  setupcinematicworld:
    description: "Generates custom biome datapacks and void worlds."
    permission: dccosmetics.admin
    usage: "/setupcinematicworld <datapack | create> [name]"
  draincolors:
    description: "Converts WE selection to Grayscale/Cyan."
    permission: dccosmetics.admin
