<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCEssentials Wiki</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-alt: #161922;
      --bg-code: #1c212e;
      --bg-hover: #212736;
      --border: #283042;
      --border-soft: #202736;
      --text: #c9d1d9;
      --text-strong: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.12);
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.12);
      --amber: #d29922;
      --amber-bg: rgba(210, 153, 34, 0.12);
      --red: #f85149;
      --red-bg: rgba(248, 81, 73, 0.12);
      --purple: #bc8cff;
      --purple-bg: rgba(188, 140, 255, 0.12);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --header-h: 56px;
      --sidebar-w: 236px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + 18px);
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-weight: 400;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* Top Sticky Navigation & Global Search */
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--header-h);
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-strong);
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 4px 0;
      font-family: inherit;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .menu-btn:hover { background: var(--bg-hover); }

    /* Search Widget */
    .search-wrap {
      position: relative;
      flex: 1 1 260px;
      max-width: 500px;
      min-width: 160px;
    }

    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      pointer-events: none;
      user-select: none;
    }

    .search-wrap input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-strong);
      padding: 7px 54px 7px 32px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-wrap input::placeholder {
      color: var(--text-muted);
    }

    .search-actions {
      position: absolute;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .search-clear {
      display: none;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1;
      padding: 2px 5px;
      cursor: pointer;
      border-radius: 4px;
    }
    .search-clear.visible { display: inline-flex; }
    .search-clear:hover { color: var(--text-strong); background: var(--bg-hover); }

    .search-kbd {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--bg-alt);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      pointer-events: none;
    }

    .search-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-height: min(440px, 68vh);
      overflow-y: auto;
      z-index: 80;
    }
    .search-popover.open { display: block; }

    .search-pop-head {
      padding: 7px 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-hit {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .search-hit:last-child { border-bottom: 0; }
    .search-hit:hover, .search-hit.selected { background: var(--bg-hover); }

    .search-hit-body { min-width: 0; }
    .search-hit-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-hit-title {
      color: var(--text-strong);
      font-size: 0.88rem;
      font-weight: 500;
      word-break: break-word;
    }
    .search-hit-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .topbar-links {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .top-link {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .top-link:hover { background: var(--bg-hover); color: var(--text-strong); }

    /* Wiki Layout (Responsive Flow, Zoom-Safe) */
    .wiki-shell {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
    }

    aside.sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      position: sticky;
      top: var(--header-h);
      max-height: calc(100vh - var(--header-h));
      overflow-y: auto;
      padding: 18px 12px 28px 18px;
      border-right: 1px solid var(--border-soft);
    }

    .nav-group { margin-bottom: 18px; }
    .nav-group-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0 10px 6px;
      font-weight: 600;
    }

    .nav-link {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 2px solid transparent;
      padding: 6px 10px;
      margin-bottom: 2px;
      border-radius: 0 6px 6px 0;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 400;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-link:hover {
      background: var(--bg-alt);
      color: var(--text-strong);
    }
    .nav-link.active {
      background: var(--accent-bg);
      border-left-color: var(--accent);
      color: var(--text-strong);
      font-weight: 500;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 35;
    }
    .sidebar-backdrop.open { display: block; }

    /* Article Content */
    main.wiki-main {
      flex: 1 1 auto;
      min-width: 0;
      padding: 26px clamp(16px, 3vw, 44px) 64px;
    }

    .article {
      max-width: 900px;
      min-width: 0;
    }
    .article.wide {
      max-width: 1120px;
    }

    .page-header {
      padding-bottom: 14px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-breadcrumb {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .page-header h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-strong);
      letter-spacing: -0.01em;
    }

    .page-lead {
      margin: 0;
      font-size: 0.96rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.55;
    }

    /* Section Jump Strip (Mini TOC) */
    .page-toc {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 22px;
      font-size: 0.82rem;
    }
    .page-toc-label {
      color: var(--text-muted);
      margin-right: 4px;
    }
    .toc-chip {
      padding: 3px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-alt);
      color: var(--text);
      white-space: nowrap;
      text-decoration: none;
    }
    .toc-chip:hover {
      border-color: var(--accent);
      color: var(--text-strong);
      text-decoration: none;
    }

    /* Wiki Headings & Prose */
    section.wiki-sec {
      margin-bottom: 30px;
      scroll-margin-top: calc(var(--header-h) + 18px);
    }

    section.wiki-sec h2 {
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 1.22rem;
      font-weight: 600;
      color: var(--text-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sec-flash {
      animation: secPulse 1.4s ease;
    }
    @keyframes secPulse {
      0% { background: rgba(56, 189, 248, 0.16); border-radius: 6px; }
      100% { background: transparent; }
    }

    .wiki-sec p {
      margin: 0 0 10px;
      font-weight: 400;
      color: var(--text);
    }

    .wiki-sec ul {
      margin: 0 0 12px;
      padding-left: 20px;
    }
    .wiki-sec li {
      margin-bottom: 6px;
      font-weight: 400;
    }

    strong { font-weight: 600; color: var(--text-strong); }

    code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: var(--bg-code);
      color: #dce6f2;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-soft);
      word-break: break-word;
    }

    /* Clean Wiki Boxes & Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 14px;
    }

    .box {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      min-width: 0;
    }

    .box h3 {
      margin: 0 0 8px;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-strong);
    }

    .box p:last-child, .box ul:last-child { margin-bottom: 0; }

    /* Callouts */
    .callout {
      border-left: 3px solid var(--accent);
      background: var(--bg-alt);
      border-top: 1px solid var(--border-soft);
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      border-radius: 0 6px 6px 0;
      padding: 12px 15px;
      margin: 14px 0;
    }
    .callout.warn { border-left-color: var(--amber); }
    .callout.note { border-left-color: var(--green); }
    .callout-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-strong);
      margin-bottom: 4px;
    }
    .callout p { margin: 0; font-size: 0.92rem; }

    /* Tags / Badges — single-line, compact, never wrapped */
    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 500;
      line-height: 1.3;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-code);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .tag.blue { color: #7dd3fc; background: var(--accent-bg); border-color: rgba(56, 189, 248, 0.3); }
    .tag.green { color: #6ee7b7; background: var(--green-bg); border-color: rgba(63, 185, 80, 0.3); }
    .tag.amber { color: #fcd34d; background: var(--amber-bg); border-color: rgba(210, 153, 34, 0.3); }
    .tag.red { color: #fca5a5; background: var(--red-bg); border-color: rgba(248, 81, 73, 0.3); }
    .tag.purple { color: #d8b4fe; background: var(--purple-bg); border-color: rgba(188, 140, 255, 0.3); }

    /* Clean Wiki Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-alt);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.89rem;
    }

    th {
      text-align: left;
      padding: 9px 12px;
      background: var(--bg-code);
      color: var(--text-strong);
      font-weight: 600;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: top;
      font-weight: 400;
      line-height: 1.5;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

    .nowrap-col { white-space: nowrap; }

    /* Filter Toolbar & Inputs */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-btn:hover { color: var(--text-strong); border-color: #3a465f; }
    .pill-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--text-strong);
    }

    .inline-filter {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      color: var(--text-strong);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-family: inherit;
      min-width: 190px;
      outline: none;
    }
    .inline-filter:focus { border-color: var(--accent); }

    /* Code Blocks */
    pre {
      position: relative;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.84rem;
      line-height: 1.5;
      color: #d6e0ec;
      margin: 10px 0;
    }
    pre code {
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      font-size: inherit;
      word-break: normal;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-code);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.74rem;
      font-family: var(--mono);
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--text-strong); }

    .copyable {
      cursor: pointer;
    }
    .copyable:hover {
      border-color: var(--accent);
      color: var(--text-strong);
    }

    /* Simple Interactive Calculators */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .calc-field label {
      display: block;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .calc-field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-strong);
      border-radius: 5px;
      padding: 5px 8px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    .calc-out {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.86rem;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    /* Toast */
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--bg-code);
      border: 1px solid var(--accent);
      color: var(--text-strong);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.84rem;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Zoom / Tablet / Narrow Screen Adaptations */
    @media (max-width: 860px) {
      .menu-btn { display: inline-flex; }
      .topbar-links { display: none; }
      aside.sidebar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        bottom: 0;
        max-height: none;
        background: var(--bg-alt);
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.18s ease;
        z-index: 45;
      }
      aside.sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button type="button" class="menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">Menu</button>
    <button type="button" class="brand-link" id="brandHomeBtn">
      <span class="brand-dot"></span>
      <span>DCEssentials Wiki</span>
    </button>

    <div class="search-wrap" id="searchWrap">
      <div class="search-input-box">
        <span class="search-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input
          type="text"
          id="globalSearch"
          placeholder="Search commands, placeholders, pets, emperor, npc..."
          autocomplete="off"
          aria-label="Search documentation"
        />
        <span class="search-actions">
          <button type="button" class="search-clear" id="searchClearBtn" aria-label="Clear search">&times;</button>
          <span class="search-kbd" id="searchKbd">/</span>
        </span>
      </div>
      <div class="search-popover" id="searchPopover" role="listbox"></div>
    </div>

    <div class="topbar-links">
      <button type="button" class="top-link" id="jumpCommandsBtn">Commands</button>
      <button type="button" class="top-link" id="jumpPlaceholdersBtn">Placeholders</button>
    </div>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="wiki-shell">
  <aside class="sidebar" id="sidebar" aria-label="Documentation sections">
    <nav id="navList"></nav>
  </aside>

  <main class="wiki-main">
    <article class="article" id="articleRoot"></article>
  </main>
</div>

<div class="toast" id="toast">Copied</div>

<script>
/* ============================================================================
 * SECTION 1: DATA REGISTRIES
 * Add new commands, placeholders, pets, or scrolls directly below.
 * Everything in these arrays is automatically indexed by the search bar.
 * ============================================================================ */

const COMMANDS_REGISTRY = [
  // Core
  { cmd: "/dce status", aliases: ["/dcessentials", "/dcess"], perm: "dcessentials.admin", module: "Core", desc: "Prints loaded DCEssentials modules and registered item, scroll, and pet counts." },
  { cmd: "/dce reload", aliases: ["/dcessentials reload"], perm: "dcessentials.admin", module: "Core", desc: "Hot-reloads main configs, ItemModule, TeleportationManager, RngManager, EventManager, and PetManager." },

  // Items & Stats
  { cmd: "/dce give <player> <itemOrScrollId> [amount]", aliases: ["/dcessentials give"], perm: "dcessentials.admin", module: "Items & Stats", desc: "Gives a registered DCEItem, Scroll, or Pet Token with full PDC identity. Tab-completes players, IDs, and stack sizes." },
  { cmd: "/dce update [itemId]", aliases: ["/dcessentials update"], perm: "dcessentials.admin", module: "Items & Stats", desc: "Syncs existing items with updated stats/lore while keeping skins, dyes, sockets, and enchantments." },

/* ============================================================================
 * SECTION 3: FULL-TEXT OFFLINE SEARCH INDEX
 * Indexes pages, section headings, commands, placeholders, pets, and scrolls.
 * ============================================================================ */

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function stripTags(html) {
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

const SEARCH_INDEX = [];

function buildSearchIndex() {
  SEARCH_INDEX.length = 0;

  // 1. Page summaries + sections
  DOC_MODULES.forEach(mod => {
    const html = mod.render();
    SEARCH_INDEX.push({
      kind: 'Page',
      tagCls: 'blue',
      title: mod.navLabel,
      sub: mod.subtitle,
      modId: mod.id,
      secId: null,
      copy: null,
      haystack: `${mod.navLabel} ${mod.title} ${mod.subtitle}`.toLowerCase()
    });

    const secRegex = /<section[^>]*id="([^"]+)"[^>]*>([\s\S]*?)<\/section>/gi;
    let m;
    while ((m = secRegex.exec(html)) !== null) {
      const secId = m[1];
      const bodyHtml = m[2];
      const h2Match = bodyHtml.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i);
      const heading = h2Match ? stripTags(h2Match[1]) : mod.navLabel;
      const bodyText = stripTags(bodyHtml);
      SEARCH_INDEX.push({
        kind: mod.navLabel,
        tagCls: 'blue',
        title: heading,
        sub: bodyText.slice(0, 115) + (bodyText.length > 115 ? '...' : ''),
        modId: mod.id,
        secId,
        copy: null,
        haystack: `${mod.navLabel} ${heading} ${bodyText}`.toLowerCase()
      });
    }
  });

  // 2. Commands
  COMMANDS_REGISTRY.forEach(c => {
    SEARCH_INDEX.push({
      kind: 'Command',
      tagCls: c.perm.includes('admin') ? 'red' : 'green',
      title: c.cmd,
      sub: `${c.perm} · ${c.desc}`,
      modId: 'commands',
      secId: null,
      copy: c.cmd,
      haystack: `${c.cmd} ${(c.aliases || []).join(' ')} ${c.perm} ${c.module} ${c.desc}`.toLowerCase()
    });
  });

  // 3. Placeholders
  PLACEHOLDERS_REGISTRY.forEach(p => {
    SEARCH_INDEX.push({
      kind: 'Placeholder',
      tagCls: 'blue',
      title: p.ph,
      sub: `${p.scope} · ${p.desc}`,
      modId: 'placeholders',
      secId: null,
      copy: p.ph,
      haystack: `${p.ph} ${p.scope} ${p.returns} ${p.desc}`.toLowerCase()
    });
  });

  // 4. Pets
  PETS_REGISTRY.forEach(p => {
    SEARCH_INDEX.push({
      kind: 'Pet',
      tagCls: 'purple',
      title: `${p.name} (${p.id})`,
      sub: `${p.rarity} · ${p.category} · ${p.stats} · ${p.skill}`,
      modId: 'pets',
      secId: 'sec-pet-catalog',
      copy: `/pet summon ${p.id}`,
      haystack: `${p.id} ${p.name} ${p.category} ${p.rarity} ${p.stats} ${p.skill} ${p.perks} ${p.effect}`.toLowerCase()
    });
  });

  // 5. Scrolls
  SCROLLS_REGISTRY.forEach(s => {
    SEARCH_INDEX.push({
      kind: 'Scroll',
      tagCls: 'amber',
      title: s.id,
      sub: `${s.rarity} (${s.target}) · ${s.effect}`,
      modId: 'dceitems',
      secId: 'sec-scrolls',
      copy: s.id,
      haystack: `${s.id} ${s.rarity} ${s.target} ${s.effect}`.toLowerCase()
    });
  });
}

let activeModuleId = DOC_MODULES[0].id;
let currentSearchHits = [];
let selectedHitIndex = -1;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text)).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('Copied: ' + text); } catch (_) {}
  document.body.removeChild(ta);
}

function toggleMobileMenu(forceState) {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  const open = typeof forceState === 'boolean' ? forceState : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}

function renderSidebar() {
  const groups = [];
  DOC_MODULES.forEach(m => {
    let grp = groups.find(g => g.name === m.group);
    if (!grp) {
      grp = { name: m.group, items: [] };
      groups.push(grp);
    }
    grp.items.push(m);
  });

  const navList = document.getElementById('navList');
  navList.innerHTML = groups.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${escapeHtml(g.name)}</div>
      ${g.items.map(m => `
        <button type="button" class="nav-link ${m.id === activeModuleId ? 'active' : ''}" data-mod="${escapeHtml(m.id)}">${escapeHtml(m.navLabel)}</button>
      `).join('')}
    </div>
  `).join('');

  navList.querySelectorAll('.nav-link').forEach(btn => {
    btn.addEventListener('click', () => {
      switchModule(btn.dataset.mod);
      toggleMobileMenu(false);
    });
  });
}

function switchModule(modId, targetSecId) {
  const mod = DOC_MODULES.find(m => m.id === modId) || DOC_MODULES[0];
  activeModuleId = mod.id;

  if (location.hash !== '#' + mod.id) {
    try { history.replaceState(null, '', '#' + mod.id); } catch (_) {}
  }

  renderSidebar();

  const articleRoot = document.getElementById('articleRoot');
  articleRoot.className = mod.wide ? 'article wide' : 'article';

  const tocHtml = (mod.toc && mod.toc.length)
    ? `<div class="page-toc"><span class="page-toc-label">On this page:</span>${mod.toc.map(t => `<a class="toc-chip" href="#${escapeHtml(mod.id)}" data-jump-sec="${escapeHtml(t.id)}">${escapeHtml(t.label)}</a>`).join('')}</div>`
    : '';

  articleRoot.innerHTML = `
    <div class="page-header">
      <div class="page-breadcrumb">${escapeHtml(mod.group)} / ${escapeHtml(mod.navLabel)}</div>
      <h1>${escapeHtml(mod.title)}</h1>
      <p class="page-lead">${escapeHtml(mod.subtitle)}</p>
    </div>
    ${tocHtml}
    ${mod.render()}
  `;

  wireArticleWidgets();

  if (targetSecId) {
    const secEl = document.getElementById(targetSecId);
    if (secEl) {
      secEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      secEl.classList.remove('sec-flash');
      void secEl.offsetWidth;
      secEl.classList.add('sec-flash');
      return;
    }
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function wireArticleWidgets() {
  const root = document.getElementById('articleRoot');

  root.querySelectorAll('[data-jump-sec]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(link.dataset.jumpSec);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  root.querySelectorAll('[data-copy-literal]').forEach(el => {
    el.addEventListener('click', () => copyText(el.dataset.copyLiteral));
  });

  root.querySelectorAll('[data-copy-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      const codeEl = document.getElementById(btn.dataset.copyTarget);
      if (codeEl) copyText(codeEl.textContent);
    });
  });

  // Commands table filters (category pills + inline text input)
  const cmdTable = document.getElementById('commandsTable');
  if (cmdTable) {
    let activeModFilter = 'ALL';
    const cmdTextInput = document.getElementById('cmdTableFilter');
    const applyCmdFilters = () => {
      const q = cmdTextInput ? cmdTextInput.value.trim().toLowerCase() : '';
      cmdTable.querySelectorAll('tbody tr').forEach(row => {
        const modOk = activeModFilter === 'ALL' || row.dataset.cmdMod === activeModFilter;
        const textOk = !q || (row.dataset.cmdText || '').includes(q);
        row.style.display = (modOk && textOk) ? '' : 'none';
      });
    };
    root.querySelectorAll('#cmdFilters .pill-btn').forEach(pill => {
      pill.addEventListener('click', () => {
        root.querySelectorAll('#cmdFilters .pill-btn').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeModFilter = pill.dataset.cmdFilter;
        applyCmdFilters();
      });
    });
    if (cmdTextInput) cmdTextInput.addEventListener('input', applyCmdFilters);
  }

  // Placeholders table inline filter
  const phTable = document.getElementById('placeholdersTable');
  const phTextInput = document.getElementById('phTableFilter');
  if (phTable && phTextInput) {
    phTextInput.addEventListener('input', () => {
      const q = phTextInput.value.trim().toLowerCase();
      phTable.querySelectorAll('tbody tr').forEach(row => {
        row.style.display = (!q || (row.dataset.phText || '').includes(q)) ? '' : 'none';
      });
    });
  }

  // Pet category filter
  root.querySelectorAll('#petFilters .pill-btn').forEach(pill => {
    pill.addEventListener('click', () => {
      root.querySelectorAll('#petFilters .pill-btn').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const f = pill.dataset.petFilter;
      root.querySelectorAll('#petsTable tbody tr').forEach(row => {
        const cat = row.dataset.petCat || '';
        const show = f === 'ALL' || cat === f;
        row.style.display = show ? '' : 'none';
      });
    });
  });

  // Stat calculator
  const calcOut = document.getElementById('statCalcOut');
  if (calcOut) {
    const updateStatCalc = () => {
      const w = Math.max(0, Number(document.getElementById('cWepSurge').value) || 0);
      const p = Math.max(0, Number(document.getElementById('cPetSurge').value) || 0);
      const a = Math.max(0, Number(document.getElementById('cAccSurge').value) || 0);
      const baseRes = Math.max(2, Number(document.getElementById('cResBase').value) || 2);
      const resCount = Math.max(0, Number(document.getElementById('cResCount').value) || 0);
      const totalSurge = w + p + a;
      const effRes = resCount <= 0 ? 'None' : `${Math.max(2, Math.round(baseRes - Math.max(0, resCount - 1)))}-Hit Cadence`;
      calcOut.innerHTML = `<span>Stacked Surge Cap: <code>+${totalSurge}%</code></span><span>Effective Resonance: <code>${effRes}</code></span>`;
    };
    ['cWepSurge', 'cPetSurge', 'cAccSurge', 'cResBase', 'cResCount'].forEach(id => {
      const inp = document.getElementById(id);
      if (inp) inp.addEventListener('input', updateStatCalc);
    });
    updateStatCalc();
  }

  // Emperor scaling simulator
  const empOut = document.getElementById('empCalcOut');
  if (empOut) {
    const updateEmpCalc = () => {
      const n = Math.max(1, Number(document.getElementById('cEmpPlayers').value) || 1);
      const base = Math.max(1, Number(document.getElementById('cEmpBaseDmg').value) || 20);
      const scale = n <= 1 ? 1.0 : 1.0 + ((n - 1) * 0.33);
      const empOutgoing = (base * scale).toFixed(1);
      const playerDmgPct = ((1.0 / scale) * 100).toFixed(1);
      empOut.innerHTML = `<span>angerScale: <code>${scale.toFixed(2)}x</code></span><span>Boss Outgoing: <code>${empOutgoing}</code></span><span>Player Damage Weight: <code>${playerDmgPct}%</code></span>`;
    };
    ['cEmpPlayers', 'cEmpBaseDmg'].forEach(id => {
      const inp = document.getElementById(id);
      if (inp) inp.addEventListener('input', updateEmpCalc);
    });
    updateEmpCalc();
  }
}

function closeSearchPopover() {
  document.getElementById('searchPopover').classList.remove('open');
  selectedHitIndex = -1;
}

function openSearchHit(hit) {
  if (!hit) return;
  closeSearchPopover();
  switchModule(hit.modId, hit.secId);
}

function renderSearchPopover(query) {
  const pop = document.getElementById('searchPopover');
  const clearBtn = document.getElementById('searchClearBtn');
  const kbdEl = document.getElementById('searchKbd');
  const q = query.trim().toLowerCase();

  clearBtn.classList.toggle('visible', q.length > 0);
  kbdEl.style.display = q.length > 0 ? 'none' : '';

  if (!q) {
    currentSearchHits = [];
    closeSearchPopover();
    return;
  }

  const terms = q.split(/\s+/).filter(Boolean);
  const scored = [];
  for (const item of SEARCH_INDEX) {
    if (!terms.every(t => item.haystack.includes(t))) continue;
    let score = 0;
    const titleLower = item.title.toLowerCase();
    if (titleLower === q) score += 100;
    else if (titleLower.includes(q)) score += 30;
    if (item.kind === 'Page') score += 15;
    if (item.kind === 'Command' && titleLower.startsWith(q)) score += 20;
    scored.push({ item, score });
  }
  scored.sort((a, b) => b.score - a.score);
  currentSearchHits = scored.slice(0, 16).map(x => x.item);
  selectedHitIndex = currentSearchHits.length ? 0 : -1;

  if (!currentSearchHits.length) {
    pop.innerHTML = `<div class="search-pop-head"><span>No matches for "${escapeHtml(query)}"</span><span>Esc to close</span></div>`;
    pop.classList.add('open');
    return;
  }

  pop.innerHTML = `
    <div class="search-pop-head">
      <span>${scored.length} match${scored.length === 1 ? '' : 'es'}${scored.length > 16 ? ' (top 16)' : ''}</span>
      <span>Up/Down · Enter</span>
    </div>
    ${currentSearchHits.map((h, i) => `
      <div class="search-hit ${i === selectedHitIndex ? 'selected' : ''}" data-hit-idx="${i}" role="option">
        <div class="search-hit-body">
          <div class="search-hit-top">
            <span class="tag ${h.tagCls}">${escapeHtml(h.kind)}</span>
            <span class="search-hit-title">${escapeHtml(h.title)}</span>
          </div>
          <div class="search-hit-sub">${escapeHtml(h.sub)}</div>
        </div>
        ${h.copy ? `<button type="button" class="pill-btn" data-hit-copy="${escapeHtml(h.copy)}">Copy</button>` : ''}
      </div>
    `).join('')}
  `;
  pop.classList.add('open');

  pop.querySelectorAll('.search-hit').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.hitIdx);
      openSearchHit(currentSearchHits[idx]);
    });
  });

  pop.querySelectorAll('[data-hit-copy]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      copyText(btn.dataset.hitCopy);
    });
  });
}

function updateSelectedHitClass() {
  const rows = document.querySelectorAll('#searchPopover .search-hit');
  rows.forEach((row, i) => {
    row.classList.toggle('selected', i === selectedHitIndex);
    if (i === selectedHitIndex && row.scrollIntoView) {
      row.scrollIntoView({ block: 'nearest' });
    }
  });
}

// Init
buildSearchIndex();

const searchInput = document.getElementById('globalSearch');
searchInput.addEventListener('input', e => renderSearchPopover(e.target.value));
searchInput.addEventListener('focus', e => {
  if (e.target.value.trim()) renderSearchPopover(e.target.value);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSearchPopover();
    searchInput.blur();
  } else if (e.key === 'ArrowDown' && currentSearchHits.length) {
    e.preventDefault();
    selectedHitIndex = (selectedHitIndex + 1) % currentSearchHits.length;
    updateSelectedHitClass();
  } else if (e.key === 'ArrowUp' && currentSearchHits.length) {
    e.preventDefault();
    selectedHitIndex = (selectedHitIndex - 1 + currentSearchHits.length) % currentSearchHits.length;
    updateSelectedHitClass();
  } else if (e.key === 'Enter' && selectedHitIndex >= 0 && currentSearchHits[selectedHitIndex]) {
    e.preventDefault();
    openSearchHit(currentSearchHits[selectedHitIndex]);
  }
});

document.getElementById('searchClearBtn').addEventListener('click', () => {
  searchInput.value = '';
  renderSearchPopover('');
  searchInput.focus();
});

document.addEventListener('click', e => {
  const wrap = document.getElementById('searchWrap');
  if (wrap && !wrap.contains(e.target)) closeSearchPopover();
});

document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if ((e.ctrlKey && e.key.toLowerCase() === 'k') || (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA')) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select && searchInput.select();
  }
});

document.getElementById('mobileMenuBtn').addEventListener('click', () => toggleMobileMenu());
document.getElementById('sidebarBackdrop').addEventListener('click', () => toggleMobileMenu(false));
document.getElementById('brandHomeBtn').addEventListener('click', () => switchModule('overview'));
document.getElementById('jumpCommandsBtn').addEventListener('click', () => switchModule('commands'));
document.getElementById('jumpPlaceholdersBtn').addEventListener('click', () => switchModule('placeholders'));

const initialHash = location.hash ? location.hash.slice(1) : '';
const initialMod = DOC_MODULES.some(m => m.id === initialHash) ? initialHash : DOC_MODULES[0].id;
switchModule(initialMod);
</script>
</body>
</html>
