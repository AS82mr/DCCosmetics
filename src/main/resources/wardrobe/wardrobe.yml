# DCCosmetics Wardrobe Configuration

# Wardrobe Mode: 1 = Legacy 3D TextDisplays & Hotbar Controller, 2 = Modern UltimateUI Screen GUI
wardrobe_version: 2

# ── Category Visibility ───────────────────────────────────────────────
# Only the categories listed below will appear in the wardrobe UI.
# Waist and Sword are omitted while they are empty or experimental.
categories:
  enabled:
    - "Head"
    - "Chest"
    - "Boots"
    - "Teleport"

# ── Cosmetics Filtering ───────────────────────────────────────────────
# Specific cosmetic IDs to hide from the wardrobe interface.
# (You can also put 'hidden: true' or 'enabled: false' directly inside any cosmetic's YAML file)
cosmetics:
  hidden:
    # - "bag"
    # - "arrow"

# ── Remote Controller Item ───────────────────────────────────────────
# Item placed in the player's hotbar during wardrobe navigation.
controller:
  material: "STONE_BUTTON"
  custom-model-data: 0
  name: "&#84E2CD&l✦ Wardrobe Remote ✦"
  lore:
    - "&8• &bScroll &8» &7Navigate Items"
    - "&8• &bLeft-Click &8» &aEquip &7/ &fSelect"
    - "&8• &bRight-Click &8» &eBack"
    - "&8• &bSneak &8» &cExit Wardrobe"

camera:
  lock-camera-packet: false
  laser-enabled: false
  model: "none"

mannequin:
  use-citizens: true

room:
  # The world where the wardrobe is located
  world: Spawn
  
  # Where the player spawns (camera lock point) when entering the wardrobe
  spawn:
    x: 393.0204037378195
    y: 79.0
    z: -547.4047805289323
    yaw: -66.4106
    pitch: 0.4499422
  
  # Where the mannequin NPC stands
  npc:
    x: 396.55675097305397
    y: 79.0
    z: -544.5374789060168
    yaw: 46.990578
    pitch: 0.0
  
  # Where the player goes when they click "Exit Wardrobe"
  # (If true, returns them to their previous location instead)
  return_to_previous_location: true
  fallback_exit:
    x: 388.1108664535434
    y: 78.0
    z: -545.3675293710643
    yaw: 90.48944
    pitch: -2.700051
  
  # Region boundaries to prevent the player from walking out
  region:
    min:
      x: 398.0
      y: 78.0
      z: -542.0
    max:
      x: 391.0
      y: 85.0
      z: -551.0
  
  # Where players' bodies are held during camera mode (set via /wardrobe setsaferoom)
  safe_room:
    x: 393.0204037378195
    y: 79.0
    z: -547.4047805289323
    yaw: -66.4106
    pitch: 0.4499422

  # V2 Camera positions per category (set via /wardrobe studio setcam <category>)
  # Keys: overview, head, chest, boots, teleport
  cameras: {}

hud:
  # ── NEW: Feature Toggles ───────────────────────────────────────────────────
  # Each menu row as its own separate hologram entity (individual highlight
  # animations on scroll). false = legacy unified panel (default, safe).
  modular-buttons: false
  
  # Thin BlockDisplay laser from camera rig to selected button.
  # Only works when modular-buttons is true.
  laser-pointer: false
  
  # ── Diagnostic: Step Limiter ───────────────────────────────────────────────
  # Controls how far the wardrobe cinematic goes. Set to 6 for normal operation.
  # Lower to isolate which step is causing a crash:
  #   1 = title + chime only (no entities)
  #   2 = + spawn HUD
  #   3 = + spawn mannequin
  #   4 = + lock camera
  #   5 = + spawn CCTV rig
  #   6 = + reposition HUD for camera (full — normal operation)
  diagnostic-max-step: 6
  
