# ==============================================================================
# DCEssentials Vanilla Enchantment Caps Configuration
# Only vanilla Minecraft enchantments are managed here (no custom enchantments).
#
# Setting a level higher than vanilla (e.g. sharpness: 6) does NOT unlock
# over-cap levels in vanilla Enchanting Tables. Higher-level books are obtained
# from crates/rewards and applied via Anvil or Drag-and-Drop up to this cap.
#
# Tooltip Highlighting:
#   - Level >= configured cap  -> &c (Maxed)
#   - Level < configured cap   -> &9 (Standard)
# ==============================================================================

max_levels:
  # Melee & Trident
  sharpness: 5
  smite: 5
  bane_of_arthropods: 5
  knockback: 2
  fire_aspect: 2
  looting: 3
  sweeping_edge: 3
  impaling: 5
  loyalty: 3
  riptide: 3
  channeling: 1

  # Mace
  density: 5
  breach: 4
  wind_burst: 3

  # Bows & Crossbows
  power: 5
  punch: 2
  flame: 1
  infinity: 1
  multishot: 1
  quick_charge: 3
  piercing: 4

  # Tools & Fishing
  efficiency: 5
  silk_touch: 1
  unbreaking: 3
  fortune: 3
  lure: 3
  luck_of_the_sea: 3

  # Armor
  protection: 4
  fire_protection: 4
  feather_falling: 4
  blast_protection: 4
  projectile_protection: 4
  respiration: 3
  aqua_affinity: 1
  thorns: 3
  depth_strider: 3
  frost_walker: 2
  soul_speed: 3
  swift_sneak: 3

  # Utility & Curses
  mending: 1
  binding_curse: 1
  vanishing_curse: 1
