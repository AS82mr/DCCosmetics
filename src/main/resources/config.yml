# ------------------------------------------------------------------------------
# 2. DATABASE CONFIGURATION (SQLITE / MYSQL)
# ------------------------------------------------------------------------------
database:
  type: "sqlite" # 'sqlite' (stored in data/database.db) or 'mysql'
  sqlite:
    file: "data/database.db"
  mysql:
    enabled: false
    host: "127.0.0.1"
    port: 3306
    database: "dragoncote"
    username: "root"
    password: ""
    pool_size: 10

# ------------------------------------------------------------------------------
# 3. TEMPORAL KEYSTONE & THERMODYNAMICS CONFIGURATION
# ------------------------------------------------------------------------------
teleportation:
  keystone:
    newbie-shield-days: 3
    nether-heat-multiplier: 2.0
    nexus-incursion-cooldown-seconds: 300
    cryo-purge-amount: 20
    cryo-cooldown-seconds: 5
    tpa-synergy-cooldown-heat: 15

# ------------------------------------------------------------------------------
# 4. 3D NAVIGATIONAL WAYPOINT ARROW CONFIGURATION
# ------------------------------------------------------------------------------
waypoints:
  forward-distance: 1.5
  height-offset: -0.95
  scale: 0.3
  hover-speed: 0.15
  hover-amplitude: 0.04
  max-pitch: 60.0
  arrival-distance: 3.0

# ------------------------------------------------------------------------------
# 5. CINEMATIC DESOLATION BIOME DATAPACK SETTINGS
# ------------------------------------------------------------------------------
cinematic_biomes:
  desolation:
    sky_color: "#101214"
    fog_color: "#1A2626"
    water_color: "#0A1718"
    water_fog_color: "#051010"
    grass_color: "#353A3A"
    foliage_color: "#1B4D4D"

  crimson_rot:
    sky_color: "#1A0505"
    fog_color: "#2B0A0A"
    water_color: "#250000"
    water_fog_color: "#150000"
    grass_color: "#2A2020"
    foliage_color: "#551111"

# ------------------------------------------------------------------------------
# 6. SYSTEM DEBUG LOGGING
# ------------------------------------------------------------------------------
debug-mode:
  - dcnpc

