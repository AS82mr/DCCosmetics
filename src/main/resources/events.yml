    custom_model_data: 0
    duration_minutes: 15
    interval_minutes: 90
    warp: iceboat
    start_command: none
    end_command: none
    sound: ENTITY_BOAT_PADDLE_WATER
    reward_summary: Speedster Trophy & Drift Particles
    lore:
    - '&7High-speed ice racing circuit heats are live!'
    - '&7Jump into your boat and post the top lap time.'
    perks:
    - '&b• Ice drift physics enabled'
    - '&b• Clickable warp available: &f/warp iceboat'
