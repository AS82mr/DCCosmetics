# DCCosmetics Wardrobe Configuration

room:
  # The world where the wardrobe is located
  world: Spawn
  
  # Where the player spawns (camera lock point) when entering the wardrobe
  spawn:
    x: 393.0204037378195
    y: 79.0
    z: -547.4047805289323
    yaw: -66.4106
    pitch: 0.4499422
  
  # Where the mannequin NPC stands
  npc:
    x: 396.53828236858163
    y: 79.0
    z: -544.462916622202
    yaw: 118.689545
    pitch: -1.3500094
  
  # Where the player goes when they click "Exit Wardrobe"
  # (If true, returns them to their previous location instead)
  return_to_previous_location: true
  fallback_exit:
    x: 388.1108664535434
    y: 78.0
    z: -545.3675293710643
    yaw: 90.48944
    pitch: -2.700051
  
  # Region boundaries to prevent the player from walking out
  region:
    min:
      x: 398.0
      y: 78.0
      z: -542.0
    max:
      x: 391.0
      y: 85.0
      z: -551.0

  # Where players' bodies are held during camera mode (set via /wardrobe setsaferoom)
  safe_room:
    x: 198.3082879636369
    y: 144.0
    z: -498.57923068196226
    yaw: -86.95935
    pitch: 5.550043

hud:
  # ── NEW: Feature Toggles ───────────────────────────────────────────────────
  # Each menu row as its own separate hologram entity (individual highlight
  # animations on scroll). false = legacy unified panel (default, safe).
  modular-buttons: false

  # Thin BlockDisplay laser from camera rig to selected button.
  # Only works when modular-buttons is true.
  laser-pointer: false

  # ── Diagnostic: Step Limiter ───────────────────────────────────────────────
  # Controls how far the wardrobe cinematic goes. Set to 6 for normal operation.
  # Lower to isolate which step is causing a crash:
  #   1 = title + chime only (no entities)
  #   2 = + spawn HUD
  #   3 = + spawn mannequin
  #   4 = + lock camera
  #   5 = + spawn CCTV rig
  #   6 = + reposition HUD for camera (full — normal operation)
  diagnostic-max-step: 6

